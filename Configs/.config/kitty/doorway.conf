# DOORway — kitty identity layer.
# The DOORway "look": font, padding, brand watermark, and colors. kitty.conf
# (kitty's auto-loaded entry point) includes this once, then layers terminal
# behaviour and overrides on top. Each setting has a single home — the look
# lives here, behaviour lives in kitty.conf — so includes never fight.

# Font
font_family       CaskaydiaCove Nerd Font Mono
bold_font         auto
italic_font       auto
bold_italic_font  auto

enable_audio_bell no

window_padding_width 25

# Brand watermark: the Atari mark, tucked subtly into the bottom-right corner.
# atari-symbolic.png is a copy of the QuickShell brand asset
# (../quickshell/doorway/assets/icons/atari-symbolic.png), kept here so the
# terminal config is self-contained. window_logo_path is relative to this dir.
window_logo_path     atari-symbolic.png
window_logo_position bottom-right
window_logo_alpha    0.35
window_logo_scale    18

# Color theme (override-friendly — settings above can be overridden by it).
include theme.conf
