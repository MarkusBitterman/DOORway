# DOORway kitty config — entry point (kitty loads this automatically).
# Pulls in the DOORway identity layer (font, padding, brand logo, colors),
# then sets terminal behaviour and personal overrides below. Settings here win
# over doorway.conf where they overlap, so keep behaviour here, the look there.

include doorway.conf

# Use zsh, resolved on PATH — no hardcoded home paths, so this ships to any machine.
shell zsh

# Appearance misc
hide_window_decorations yes
mouse_hide_wait         -3.0

# Tab bar
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style round
tab_title_template  {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Low-latency rendering (slightly higher energy use)
input_delay        0
repaint_delay      2
sync_to_monitor    yes
wayland_enable_ime yes

enable_audio_bell no
notify_on_cmd_finish invisible 20

copy_on_select yes
paste_actions quote-urls-at-prompt,confirm-if-large
